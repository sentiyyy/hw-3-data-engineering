services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: analyst10-rustfs
    command: ["/data"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Copy .env.example to .env and set credentials}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Copy .env.example to .env and set credentials}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "error"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyst10-pipeline
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-hh-lake}
      S3_OBJECT_KEY: ${S3_OBJECT_KEY:-raw/analyst/vacancies.jsonl}
      HH_USER_AGENT: ${HH_USER_AGENT:-AnalystVariant10/1.0 (educational project)}
      HH_REQUEST_DELAY_SECONDS: ${HH_REQUEST_DELAY_SECONDS:-0.12}
      CHUNK_SIZES: ${CHUNK_SIZES:-100,500,1000}
      PROFILE_ATTEMPTS: ${PROFILE_ATTEMPTS:-3}
      MIN_COMBO_SUPPORT: ${MIN_COMBO_SUPPORT:-5}
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts
      - ./screenshots:/app/screenshots:ro
      - ./data:/app/data:ro
    depends_on:
      - rustfs
    entrypoint: ["python", "-m", "src.cli"]
    command: ["--help"]

volumes:
  rustfs-data:
